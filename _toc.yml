#######################################################################################
# Table of contents — this file controls the left sidebar.
# Docs: https://jupyterbook.org/structure/toc.html
#
# To add a lecture:
#   1. Create Lectures/NN-ShortName/index.md (copy an existing one)
#   2. Add a "- file:" entry below, with a "title:" for the sidebar label
#   3. Optional: list notebooks / transcripts under "sections:" to nest them
#######################################################################################
format: jb-book
root: index

parts:
  - caption: Course Info
    chapters:
      - file: Course_Info/Schedule
      - file: Course_Info/Syllabus/Syllabus
      - file: Course_Info/Textbook

  - caption: Course Policies
    chapters:
      - file: Policies/Deadlines
      - file: Policies/Integrity
      - file: Policies/Accessibility
      - file: Policies/Inclusion
      - file: Policies/Acknowledgments

  - caption: Lectures
    chapters:
      - file: Lectures/01-Introduction/index
        title: "Day 01 (16/09)"
        sections:
          - file: Lectures/01-Introduction/01Notebook
            title: "Jupyter Notebook"
      - file: Lectures/02-SimplicialComplexes/index
        title: "Day 02 (23/09)"
        sections:
          - file: Lectures/02-SimplicialComplexes/02Notebook
            title: "Jupyter Notebook"
      - file: Lectures/03-Homology/index
        title: "Day 03 (30/09)"
